# 内容条目元数据 / 状态机
slug:                      # 短标识，同目录名
title:                     # 工作标题
type:                      # kouban(口播) | tuwen(图文)
pillar:                    # depth(技术深度) | traffic(流量型)
status: ideated            # 生产线: ideated→drafting→review→approved→scheduled→published | rejected
                           # retro_done 由治理线(automation/harness/)复盘后置位，非生产线状态
source:                    # 选题来源（哪个信息源/热点）

schedule:                  # 计划发布时间
publish_url:               # 发布后回填

timestamps:
  ideated:
  drafting:
  review:
  approved:
  published:
  retro_done:
