    `isAsync ? new AbortController() : toolUseContext.abortController`；:707-708「Async agents are fully isolated」；
    createSubagentContext 给独立 messages/readFileState/abortController；身份隔离 AsyncLocalStorage(runWithAgentContext :933)。
    脚本「独立对话记录/中断开关/文件视图，互不串台」属实。
  - 并行派多个 ← prompt.ts:162「Launch multiple agents concurrently … use a single message with multiple tool uses」；
    :184「run agents 'in parallel' … MUST send a single message with multiple Agent tool use content blocks」。
    ★「几个/好几个」属实(机制支持并发)，不写死「4 个」(源码无常量，plan「四个员工」是举例)。
  - 裁剪-防递归套娃 ← src/utils/agentToolFilter.ts `filterParentToolsForFork = parentTools.filter(t => !ALL_AGENT_DISALLOWED_TOOLS.has(t.name))`；
    黑名单 src/constants/tools.ts:44 含 AGENT_TOOL_NAME(非 ant 用户排除 Agent 工具自身)；
    AgentTool.tsx:419-429「Recursive fork guard」+ throw 'Fork is not available inside a forked worker.'。「分叉的不准再分叉」属实。
  - 裁剪-敏感不下放 ← 黑名单同含 LOCAL_MEMORY_RECALL_TOOL_NAME(跨会话用户笔记 keep main thread only)、
    VAULT_HTTP_FETCH_TOOL_NAME(用户密钥 keep main thread only)。「私人记忆/密钥只留主线」属实。
  - 裁剪-按角色配工具(只读不给写) ← ★校正：非 filterParentToolsForFork(黑名单不含 FileWrite/Edit)，
    由 agent 定义自带工具集决定(runAgent.ts:270-272 availableTools/allowedTools + agentDefinition；调研型如 Explore 不配 Edit/Write)。脚本「每种员工按角色配工具」对应此，未夸大成黑名单功能。
  - 回传 ← AgentTool.tsx:1133 `extractTextContent(agentResult.content, '\n')` 把子 agent 最终内容当工具结果回交；
    prompt.ts:171「it will return a single message back to you … not visible to the user」；中间过程进 sidechain transcript(recordSidechainTranscript)，不回灌主对话。属实。
  - 协调者模式 ← src/coordinator/coordinatorMode.ts:111 getCoordinatorSystemPrompt，:116「orchestrates … across multiple workers」，
