fact_check: |
  本集是「手写实战」型，事实分两块核：① mini-agent 真机能力核于 demo 产物；② 满血版对照核于 source_repo。
  - [demo] demo/mini-agent.ts = 197 行单文件、零第三方依赖（仅 node:readline/promises、node:fs/promises、
    node:child_process、内置 fetch），node --experimental-strip-types 直跑。真机跑通见 demo/run-transcript.txt：
    任务「先读 a.ts 告诉我导出了啥，再统计目录 .ts 数写进 report.txt」→ 实际动作 read_file(a.ts)→「导出了常量 x」
    →权限闸拦 run_command→放行→写 report.txt→count=3（与 sandbox 实际 a.ts/b.ts/c.ts 三个 .ts 文件一致）。属实、非口嗨。
    模型端走 OpenAI 兼容协议(chat/completions + function calling + SSE 流式)，demo 实测指向 Gemini 兼容端点真实返回
    tool_calls、逐 chunk 流式——印证「agent 核心是循环、与具体哪家模型无关」(系列 EP09 论点)。
  - [3][4] loop = while 循环 / 满血版 query 核心也是 while true ← src/query.ts `export async function* query`(line 276)
    下沉 `queryLoop` 的 `while (true)`(line 460)；「只说话就结束、要 tool 就执行再回灌」对应对 `content.type === 'tool_use'`
    的提取与回填(line 160 一带)。属实。
  - [4] 「agent 的本质就是个 while 循环」← 系列 EP01 已立此论点，此处系列内自洽复述、不依赖观众看过 EP01（冷开在 [1]）。
  - [5] 工具最小三样 name + schema + 干活代码 ← src/Tool.ts 接口 `name`(line 477)、`inputSchema`(line 415)、
    `call(`(执行,line 400)；另有 `description`(line 407)、`prompt`(权限,line 539)。迷你版取最小子集，属忠实裁剪。
  - [7][8] 跑命令前问 y/n = 权限闸 ← 致敬系列权限管线集 EP05；demo askPermission 真实拦截 run_command(needsPermission=true)、
    read_file 放行(needsPermission=false)。属实。
  - [9] 流式 = 逐块读 SSE 打字机 ← demo streamTurn 用 for await 读 resp.body 的 SSE chunk、delta.content 到达即
    process.stdout.write。属实。
  - [13] 工程外壳举例(压缩/并发/缓存定位/防御兜底) ← 均为本系列已拆真实机制(压缩 EP07、并发不写坏文件 EP06、
