  全核于 source_repo（2026-06-23 Explore agent 精读 + 主回话抽验关键行号）：
  - provider 列表 = 7 种 ← src/utils/model/providers.ts:6-13
    `export type APIProvider = 'firstParty' | 'bedrock' | 'vertex' | 'foundry' | 'openai' | 'gemini' | 'grok'`。
    firstParty=自家 Claude；openai/gemini/grok=别家模型；bedrock/vertex/foundry=云上部署通道。
    ★ 据实表述「一共七种：自家 Claude + GPT/Gemini/Grok + 三种云上通道」，封面同此(Claude+GPT+Gemini+Grok+云通道×3=7)。
  - 选择优先级 ← providers.ts:15-32 getAPIProvider()：先 settings.modelType(openai/gemini/grok)；
    再 CLAUDE_CODE_USE_BEDROCK/VERTEX/FOUNDRY；再 CLAUDE_CODE_USE_OPENAI/GEMINI/GROK；全不命中 return 'firstParty'(默认)。
    脚本口语化「设置最优先 > 环境变量 > 默认 Claude」属实。
  - 流式翻译官（适配器）← src/services/api/openai/responsesAdapter.ts:249-443
    adaptResponsesStreamToAnthropic(stream, model)：async function*，:286 `for await (const event of stream)`
    逐帧消费 GPT(Responses API)的 SSE 事件，即时 yield 出 Anthropic 的 BetaRawMessageStreamEvent。
    请求方向转换 convertMessagesToResponsesInput()（:61，Anthropic→OpenAI 输入）。
  - 事件一一对应 ← responsesAdapter.ts：output_text.delta→content_block_delta/text_delta(:290-312)；
    reasoning→thinking_delta(:315-337)；output_item.added→content_block_start/tool_use(:340-374)；
    function_call_arguments.delta→input_json_delta(:377-391)；output_item.done→content_block_stop(:394-405)；
    response.completed/incomplete→message_delta+message_stop(:419-441)。
  - 「即翻即传」+ 帧级缓冲澄清 ← 事件级零攒包(每 event 立即 yield)属实；SSE 解析 parseSSE()(:193-222)
    有协议必需的字节缓冲找 \n\n 帧边界。★ 脚本说「每收到一个小片段，当场翻、当场传」，不喊「零缓冲/延迟为零」。
  - 一家模型一个目录 + 加新 provider 不碰旧码 ← src/services/api/{openai,gemini,grok}/（各含 index.ts 导出
    queryModel<Provider>、client.ts）；分发在 src/services/api/claude.ts:1334-1372：
    `if (getAPIProvider()==='openai'){ const {queryModelOpenAI}=await import('./openai/index.js'); yield* queryModelOpenAI(...) }`，
    gemini/grok 同构分支。加新模型 = 新建目录 + 此处加一条 import 分支 + providers.ts 加类型/环境变量，旧代码不动。
  - 下游归一无感知 ← 所有 provider 最终 yield 成 Anthropic SDK 统一事件/消息类型(StreamEvent/AssistantMessage，
    packages/@ant/model-provider/src/types/message.ts)；claude.ts 下游 for await 只 switch 这套 Anthropic 事件
    → agent 循环/工具/UI 拿到永远同一种格式，不知背后是 GPT 还是 Claude。
