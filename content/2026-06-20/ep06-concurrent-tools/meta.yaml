fact_check: |
  全核于 source_repo（2026-06-20 逐条定位，Explore agent 精读 + 主回话复核）：
  - 工具自声明并发安全 ← src/Tool.ts:423 `isConcurrencySafe(input): boolean`；
    默认值保守失败闭合 = false ← src/Tool.ts:780 `isConcurrencySafe: (_input?) => false`。
    BashTool: isConcurrencySafe = isReadOnly ?? false（packages/builtin-tools/.../BashTool.tsx:570），
    cd 切目录 → 非只读 → 判不安全；WebFetch isConcurrencySafe()=true（只读网络 I/O）。
  - 读写分组（贪心分批）← src/services/tools/toolOrchestration.ts:106-131 `partitionToolCalls`：
    连续 isConcurrencySafe 工具合并一批并行；不安全工具单独成批串行。
    注释 :48 "Run read-only batch concurrently" / :78 "serially" / :101-105 partition 文档。
  - 并发上限默认 10、env 可调 ← toolOrchestration.ts:9-13 getMaxToolUseConcurrency
    `parseInt(CLAUDE_CODE_MAX_TOOL_USE_CONCURRENCY) || 10`；runToolsConcurrently 传入上限(:169-196)。
  - Promise.race 公平调度（谁先完成谁补位）← src/utils/generators.ts:34-74 `all()`：
    Set<Promise> 占满 cap，await Promise.race，done 即从 waiting 取下一个补入。
  - 流式即执行 ← src/services/tools/StreamingToolExecutor.ts:36-42 类注释（边流入边执行）、
    addTool(:88-151)→processQueue、canExecuteTool(:156-162)；query.ts:1086 流式吐出即 addTool。
  - 失败隔离（只有 Bash 取消兄弟）← StreamingToolExecutor.ts:381-391：
    `if (tool.block.name === BASH_TOOL_NAME) { hasErrored=true; siblingAbortController.abort('sibling_error') }`
    注释明写 "Bash commands often have implicit dependency chains (mkdir fails → subsequent pointless).
    Read/WebFetch are independent — one failure shouldn't nuke the rest"；
    被取消工具收合成错误消息 createSyntheticErrorMessage(:180-232)「Cancelled: parallel tool call errored」
    （结构化 tool_result is_error=true，让模型有序收尾，非粗暴掐断）。
  ★ 据实校准（plan 大纲 vs 源码）：
    1）plan 写「读文件安全、写文件不安全」是口语化归纳；源码真实机制是工具按 input 动态调 isConcurrencySafe()，
       默认 false（保守）。脚本表述为「读的随便抢，写的排队来」并补一句「自己声明 + 默认不安全」，不夸大成简单读写二分。
    2）plan 写「一个工具崩了给其他发合成错误」过泛；源码只有 Bash 失败才取消兄弟（读类独立不连坐），脚本据实收窄。
    3）结尾承接钩对齐实际下一集 EP07（上下文压缩/失忆），与 plan 结尾钩一致。
  - 合规：无臆造数据；「十个」「四条规则」是对源码默认上限与多机制的口语化归纳；无违禁词/绝对化营销/口播导流。

